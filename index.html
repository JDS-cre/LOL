<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>맞춤형 돌림판 제비뽑기</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            -webkit-tap-highlight-color: transparent;
            color: white;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
            width: 90%;
            max-width: 360px;
            position: relative;
            box-sizing: border-box;
            margin: 20px 0;
        }
        h2 { margin-top: 0; margin-bottom: 10px; font-size: 20px; }
        
        /* 입력창 영역 */
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group label {
            font-size: 12px;
            color: #cbd5e1;
            display: block;
            margin-bottom: 5px;
        }
        .input-group textarea {
            width: 100%;
            height: 60px;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: rgba(15, 23, 42, 0.6);
            color: white;
            font-size: 13px;
            resize: none;
            box-sizing: border-box;
        }
        .update-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 5px;
            width: 100%;
        }
        .update-btn:active { background: #475569; }

        /* 룰렛 디자인 */
        .roulette-container {
            position: relative;
            width: 230px;
            height: 230px;
            margin: 15px auto;
        }
        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 20px solid #ef4444;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #ffffff;
            position: relative;
            overflow: hidden;
            transition: transform 3.5s cubic-bezier(0.15, 0.85, 0.15, 1);
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
            background: #334155;
        }
        
        .wheel-label {
            position: absolute;
            width: 50%;
            height: 50%;
            top: 0;
            left: 50%;
            transform-origin: 0% 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .wheel-label span {
            position: absolute;
            font-size: 12px;
            font-weight: bold;
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            left: 15px;
            top: 40px;
        }
        
        button.draw-btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            padding: 14px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        button.draw-btn:active { transform: scale(0.97); }
        button.draw-btn:disabled { background: #475569; opacity: 0.7; cursor: not-allowed; }
        
        #result {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #f8fafc;
            min-height: 30px;
        }

        /* 비밀 조작 패널 */
        #secret-panel {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background: rgba(254, 243, 199, 0.95);
            color: #1e293b;
            border: 1px dashed #f59e0b;
            border-radius: 10px;
            text-align: left;
            font-size: 12px;
        }
        #secret-panel select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            font-size: 13px;
            background: white;
        }
        
        .secret-trigger {
            position: absolute;
            bottom: 5px;
            right: 10px;
            font-size: 10px;
            color: rgba(255,255,255,0.2);
            padding: 10px;
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🎡 맞춤형 돌림판</h2>
    
    <!-- 참여자 입력 영역 -->
    <div class="input-group">
        <label for="namesInput">참여자 입력 (쉼표로 구분):</label>
        <textarea id="namesInput">최홍혁, 전다산, 김승준, 김영훈, 김성훈, 홍승표</textarea>
        <button class="update-btn" onclick="initWheel()">돌림판 새로고침 (적용)</button>
    </div>

    <!-- 돌림판 구조 -->
    <div class="roulette-container">
        <div class="pointer"></div>
        <div class="wheel" id="wheel"></div>
    </div>

    <button class="draw-btn" id="drawBtn" onclick="startDraw()">돌림판 돌리기!</button>
    
    <div id="result"></div>

    <!-- 비밀 조작 패널 -->
    <div id="secret-panel">
        <strong>⚙️ [관리자 설정]</strong><br>
        <label for="rigged-target">다음 당첨자 강제 지정:</label>
        <select id="rigged-target">
            <option value="">랜덤 (완벽 공정 모드)</option>
        </select>
    </div>

    <!-- 구석의 투명한 비밀 버튼 -->
    <div class="secret-trigger" onclick="handleSecretClick()">•</div>
</div>

<script>
    let participants = [];
    const colors = ["#ef4444", "#f97316", "#eab308", "#10b981", "#3b82f6", "#8b5cf6", "#ec4899", "#06b6d4", "#84cc16"];
    let currentRotation = 0;
    let clickCount = 0;
    let clickTimer = null;

    // 초기 돌림판 세팅
    function initWheel() {
        const inputVal = document.getElementById('namesInput').value;
        // 쉼표나 공백 기준으로 이름을 잘라 배열로 만듦
        participants = inputVal.split(',').map(name => name.trim()).filter(name => name !== "");

        if (participants.length === 0) {
            alert("참여자를 1명 이상 입력해주세요!");
            return;
        }

        const wheel = document.getElementById('wheel');
        wheel.innerHTML = ''; // 기존 휠 초기화
        const sliceAngle = 360 / participants.length;

        // 관리자 셀렉트박스 목록도 실시간 업데이트
        const targetSelect = document.getElementById('rigged-target');
        targetSelect.innerHTML = '<option value="">랜덤 (완벽 공정 모드)</option>';
        participants.forEach(name => {
            const opt = document.createElement('option');
            opt.value = name;
            opt.innerText = name;
            targetSelect.appendChild(opt);
        });

        // 휠 조각 그리기
        participants.forEach((name, index) => {
            const labelDiv = document.createElement('div');
            labelDiv.className = 'wheel-label';
            const rotationAngle = index * sliceAngle;
            labelDiv.style.transform = `rotate(${rotationAngle}deg)`;
            
            const sliceBg = document.createElement('div');
            sliceBg.style.position = 'absolute';
            sliceBg.style.width = '100%';
            sliceBg.style.height = '100%';
            sliceBg.style.clipPath = `polygon(50% 50%, ${50 + 50 * Math.cos((index * sliceAngle - 90) * Math.PI / 180)}% ${50 + 50 * Math.sin((index * sliceAngle - 90) * Math.PI / 180)}%, ${50 + 50 * Math.cos(((index + 1) * sliceAngle - 90) * Math.PI / 180)}% ${50 + 50 * Math.sin(((index + 1) * sliceAngle - 90) * Math.PI / 180)}%)`;
            sliceBg.style.backgroundColor = colors[index % colors.length];
            wheel.appendChild(sliceBg);

            const span = document.createElement('span');
            span.innerText = name;
            span.style.transform = `rotate(${sliceAngle / 2}deg)`;
            labelDiv.appendChild(span);
            
            wheel.appendChild(labelDiv);
        });
        
        document.getElementById('result').innerText = "";
    }

    // 페이지 처음 켤 때 실행
    initWheel();

    function handleSecretClick() {
        clickCount++;
        clearTimeout(clickTimer);
        
        if (clickCount >= 3) {
            const panel = document.getElementById('secret-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
            clickCount = 0;
        } else {
            clickTimer = setTimeout(() => { clickCount = 0; }, 500);
        }
    }

    function startDraw() {
        const resultDiv = document.getElementById('result');
        const drawBtn = document.getElementById('drawBtn');
        const targetSelect = document.getElementById('rigged-target');
        const riggedTarget = targetSelect.value;
        
        drawBtn.disabled = true;
        resultDiv.innerText = "";

        let winningIndex = -1;

        if (riggedTarget !== "") {
            winningIndex = participants.indexOf(riggedTarget);
            targetSelect.value = "";
            document.getElementById('secret-panel').style.display = 'none';
        } else {
            winningIndex = Math.floor(Math.random() * participants.length);
        }

        const winner = participants[winningIndex];
        const sliceAngle = 360 / participants.length;
        const centerOffset = (winningIndex * sliceAngle) + (sliceAngle / 2);
        const extraTurns = 360 * 5; 
        
        const targetAngle = 360 - centerOffset;
        const totalRotation = currentRotation + extraTurns + (targetAngle - (currentRotation % 360) + 360) % 360;
        
        currentRotation = totalRotation;
        document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;

        setTimeout(() => {
            resultDiv.innerText = `🎉 당첨: ${winner}! 🎉`;
            drawBtn.disabled = false;
        }, 3500);
    }
</script>

</body>
</html>
